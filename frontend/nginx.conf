# Serves the SPA and acts as the gateway: only the public /api/* paths are routed.
# /internal/* is intentionally NOT proxied.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/auth/ {
    proxy_pass http://user-service:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/products {
    proxy_pass http://product-service:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/orders {
    proxy_pass http://order-service:3003;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback for client-side routes
  location / {
    try_files $uri /index.html;
  }

  location ~* \.(js|css|svg|png|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
